# LOCAL TESTING ONLY - Use this to test the image before delivery
# For production deployment, see DEPLOYMENT.md
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: civic-dates-db-local
    environment:
      POSTGRES_DB: civic_dates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  civic-dates-ms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vg-ms-civic-dates-local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9085:9085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Database (local)
      VPC_DB_HOST: postgres:5432
      VPC_DB_NAME: civic_dates
      VPC_DB_USERNAME: postgres
      VPC_DB_PASSWORD: postgres
      VPC_DB_SCHEMA: public
      # Keycloak / JWT (lab)
      KEYCLOAK_ISSUER_URI: https://lab.vallegrande.edu.pe/keycloak/realms/sigei
      KEYCLOAK_JWK_SET_URI: https://lab.vallegrande.edu.pe/keycloak/realms/sigei/protocol/openid-connect/certs
      # Services (mock for local)
      VPC_INSTITUTION_SERVICE_URL: http://localhost:8080
      INSTITUTION_MOCK_ENABLED: "true"
      # RabbitMQ (optional)
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9085/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:

networks:
  default:
    name: sigei-local-network
